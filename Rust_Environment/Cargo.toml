[package]
name = "app"
version = "0.1.0"
authors = ["david cabanis <david.cabanis@doulos.com>", "Joshua Andrews <andrews.141@wright.edu>"]
edition = "2021"

[[bin]]
name = "app"
path = "src/main.rs"
test = false
doctest = false
bench = false

[build]
target = "thumbv7m-none-eabi"


[target.thumbv7m-none-eabi]
runner = "gdb-multiarch -q target/thumbv7m-none-eabi/debug/app -x openocd.gdb"


rustflags = [
  "-C", "link-arg=-Tlink.x",
]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5.0"
panic-halt = "0.2.0"
aes-kw = "0.2.1"
hex-literal = "1.1.0"

[dependencies.stm32f4xx-hal]
version = "0.11.0"
features = ["stm32f411", ]

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
codegen-units = 1
incremental = false
debug = true
lto = true
opt-level = "s"
